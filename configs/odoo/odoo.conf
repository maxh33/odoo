[options]
# Database Configuration
db_host = odoo_postgres
db_port = 5432
db_user = odoo
db_password = odoo_test_123
db_name = False
db_maxconn = 64
db_template = template0

# HTTP Configuration
http_interface = 0.0.0.0
http_port = 8069
longpolling_port = 8072

# Worker Configuration
workers = 0
max_cron_threads = 2

# Multi-Tenant Configuration
# dbfilter = ^%d$  # Disabled for local testing - enable for production multi-tenant routing
list_db = True
db_sslmode = prefer

# Addons Path
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

# Data Directory
data_dir = /var/lib/odoo

# Security
admin_passwd = admin123
csv_internal_sep = ,

# Session Configuration
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 300

# Email Configuration (optional for local dev)
email_from = False
smtp_server = localhost
smtp_port = 25

# Localization
lang = pt_BR
timezone = America/Sao_Paulo
translate_modules = ['all']

# Logging
log_level = info
log_handler = :INFO
log_db = False
log_db_level = warning

# Performance
osv_memory_count_limit = 0
osv_memory_age_limit = 1.0

# Server Wide Modules
server_wide_modules = base,web

# Proxy Mode (False for local, True for production with Traefik)
proxy_mode = False
