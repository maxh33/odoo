[options]
# Database Configuration
db_host = odoo_postgres
db_port = 5432
db_user = odoo
db_password = odoo_test_123
db_name = odoo_master

# HTTP Configuration
http_interface = 0.0.0.0
http_port = 8069

# Worker Configuration (CRITICAL for Docker)
workers = 0

# Addons Path
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

# Data Directory
data_dir = /var/lib/odoo

# Admin Password
admin_passwd = admin

# Database Filtering (Multi-Tenant)
dbfilter = ^%d$
list_db = True

# Localization
lang = pt_BR
timezone = America/Sao_Paulo

# Logging
log_level = info
log_handler = :INFO
