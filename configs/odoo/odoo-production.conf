[options]
# Database Configuration
db_host = odoo_postgres
db_port = 5432
db_user = odoo
db_password = ${ODOO_DB_PASSWORD}
db_name = False
db_maxconn = 32
db_template = template0

# HTTP Configuration
http_interface = 0.0.0.0
http_port = 8069
longpolling_port = 8072

# Worker Configuration (CRITICAL for production)
workers = 2
max_cron_threads = 1

# Multi-Tenant Configuration
dbfilter = ^%d$
list_db = False
db_sslmode = require

# Addons Path
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

# Data Directory
data_dir = /var/lib/odoo

# Security
admin_passwd = ${ODOO_ADMIN_PASSWORD}
csv_internal_sep = ,

# Resource Limits (VPS Optimized)
limit_memory_hard = 1073741824
limit_memory_soft = 838860800
limit_request = 8192
limit_time_cpu = 300
limit_time_real = 600
limit_time_real_cron = 180

# Email Configuration
email_from = ${EMAIL_FROM}
smtp_server = ${EMAIL_HOST}
smtp_port = ${EMAIL_PORT}
smtp_user = ${EMAIL_USER}
smtp_password = ${EMAIL_PASS}
smtp_ssl = False

# Localization
lang = pt_BR
timezone = America/Sao_Paulo

# Logging
log_level = warn
log_handler = :WARN
log_db = False
syslog = True

# Performance
osv_memory_count_limit = 0
osv_memory_age_limit = 1.0

# Server Wide Modules
server_wide_modules = base,web

# Proxy Mode (Behind Traefik)
proxy_mode = True
