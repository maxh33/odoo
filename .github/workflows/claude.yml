name: "Claude Code Review"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Using OAuth token from Claude Pro account
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Direct prompt for automated review (no @claude mention needed)
          direct_prompt: |
            Review this pull request for the Odoo 18 multi-tenant platform.
            Focus on:
            - Security issues (SQL injection, XSS, credential exposure)
            - Multi-tenant isolation (missing tenant_id, RLS bypasses)
            - Odoo API misuse (unsafe eval, sudo without checks)
            - Docker/infrastructure misconfigurations
            Only report bugs and vulnerabilities. Be concise.